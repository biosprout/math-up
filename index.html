<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>MATH UP! 計算トレーニング</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E7A5A">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MATH UP!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1F8F4;--panel:#FFFFFF;--panel2:#E6F2EB;
    --primary:#1E7A5A;--primary-dark:#155C43;--accent:#D98A1F;
    --danger:#D93B4E;--text:#12241D;--sub:#5F7A6E;--border:#D6E7DE;
    --shadow:0 8px 28px rgba(30,122,90,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Noto Sans JP',system-ui,sans-serif;color:var(--text);
    background:radial-gradient(circle at 20% 0%,#DCEFE5 0%,var(--bg) 55%);
    min-height:100%;-webkit-font-smoothing:antialiased}
  .app{max-width:520px;margin:0 auto;padding:16px 16px 40px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .logo{font-family:'Poppins',sans-serif;font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--primary)}
  .logo span{color:var(--accent)}
  .sub{font-size:11px;color:var(--sub);font-weight:600;margin-top:1px}

  .hsec{background:var(--panel2);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:12px}
  .hsec h3{font-size:14px;font-weight:900;margin-bottom:8px;color:var(--accent)}
  .hsec p{font-size:12.5px;line-height:1.9;color:var(--text);font-weight:500;margin-bottom:8px}
  .hsec p:last-child{margin-bottom:0}
  .hlist{margin:6px 0 8px;padding-left:1.1em}
  .hlist li{font-size:12.5px;line-height:1.9;color:var(--sub);font-weight:500;margin-bottom:5px}
  .hlist li b{color:var(--text)}

  .bknote{background:var(--panel2);border:1px solid var(--border);border-radius:14px;
    padding:12px 14px;margin-bottom:14px}
  .bknote p{font-size:12px;color:var(--sub);font-weight:600;line-height:1.75;margin-bottom:9px}
  .bknote p b{color:var(--text);font-weight:800;font-size:12.5px}

  .helpbtn{background:var(--panel2);border:1px solid var(--border);border-radius:999px;
    width:34px;height:34px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:800;color:var(--accent);cursor:pointer;margin-right:8px}
  .helpbtn:active{transform:scale(.94)}
  .topbar .right{display:flex;align-items:center}
  .rankpill{background:var(--panel);border:1px solid var(--border);border-radius:999px;
    padding:6px 14px;font-family:'Poppins';font-size:12px;font-weight:800;color:var(--sub)}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:18px;
    padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
  .daily{display:flex;align-items:center;gap:13px;border-radius:20px;padding:15px 17px;margin-bottom:16px;cursor:pointer;
    background:linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 100%);color:#fff;box-shadow:var(--shadow);transition:.15s}
  .daily:active{transform:scale(.985)}
  .daily.done{background:linear-gradient(135deg,#C4790F 0%,#D98A1F 100%);color:#2A1D00}
  .daily .dic{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.2);
    display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto}
  .daily .dbd{flex:1;min-width:0}
  .daily .dbd h3{font-size:16px;font-weight:900;letter-spacing:.2px;line-height:1.3}
  .daily .dbd p{font-size:11px;font-weight:600;opacity:.88;margin-top:3px;line-height:1.45}
  .daily .dbar{height:5px;border-radius:99px;background:rgba(255,255,255,.3);margin-top:8px;overflow:hidden}
  .daily .dbar i{display:block;height:100%;background:currentColor;border-radius:99px}
  .daily .dgo{font-size:12px;font-weight:800;background:rgba(255,255,255,.22);
    padding:8px 12px;border-radius:999px;flex:0 0 auto;white-space:nowrap}
  .catbar{height:6px;border-radius:99px;background:var(--panel2);overflow:hidden;flex:1;margin:0 10px}
  .catbar i{display:block;height:100%;border-radius:99px;background:var(--primary)}
  .catbar i.bad{background:var(--danger)}
  .catbar i.mid{background:var(--accent)}
  .catrow{display:flex;align-items:center;font-size:12px;font-weight:700;padding:7px 0;border-bottom:1px solid var(--border)}
  .catrow:last-child{border:0}
  .catrow .cn{flex:0 0 auto;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .catrow .cv{font-family:'Poppins';flex:0 0 auto;color:var(--sub)}
  .label{font-size:12px;font-weight:800;color:var(--sub);margin:16px 0 8px}
  .help{font-size:11.5px;color:var(--sub);font-weight:500;line-height:1.7}

  .btn{width:100%;border:0;border-radius:14px;padding:14px;font-family:inherit;
    font-size:14px;font-weight:800;cursor:pointer}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-accent{background:var(--accent);color:#fff}
  .btn-ghost{background:var(--panel);border:1px solid var(--border);color:var(--text)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .back{background:none;border:0;color:var(--sub);font-size:13px;font-weight:700;
    padding:4px 0 10px;cursor:pointer;font-family:inherit}

  /* モード一覧 */
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .opts4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .opt{background:var(--panel);border:1.5px solid var(--border);border-radius:14px;
    padding:12px 6px;text-align:center;cursor:pointer;font-family:inherit;color:var(--text)}
  .opt.on{border-color:var(--primary);background:var(--panel2)}
  .opt b{display:block;font-size:13px;font-weight:800}
  .opt.on b{color:var(--primary)}
  .opt i{display:block;font-style:normal;font-size:10px;color:var(--sub);font-weight:600;margin-top:3px;line-height:1.4}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mode{background:var(--panel);border:1px solid var(--border);border-radius:16px;
    padding:14px;text-align:left;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .mode .mi{font-size:22px;display:block;margin-bottom:6px}
  .mode .mn{font-size:13.5px;font-weight:800;line-height:1.35}
  .mode .md{font-size:10.5px;color:var(--sub);font-weight:600;margin-top:4px;line-height:1.5}
  .mode .mb{font-family:'Poppins';font-size:10px;color:var(--accent);font-weight:800;margin-top:6px}

  /* 出題画面 */
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .qhead h2{font-size:16px;font-weight:900}
  .qmeta{font-family:'Poppins';font-size:13px;font-weight:800;color:var(--accent)}
  .bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-bottom:14px}
  .bar i{display:block;height:100%;background:var(--primary);transition:width .2s}
  .qbox{background:var(--panel);border:1px solid var(--border);border-radius:20px;
    padding:26px 20px;text-align:center;margin-bottom:12px;box-shadow:var(--shadow)}
  .qtext{font-family:'Poppins',sans-serif;font-size:34px;font-weight:800;letter-spacing:1px;line-height:1.3}
  .qtext.sm{font-size:26px}
  .qhint{font-size:11.5px;color:var(--sub);font-weight:600;margin-top:8px}
  .ansbox{font-family:'Poppins';font-size:30px;font-weight:800;min-height:46px;
    display:flex;align-items:center;justify-content:center;gap:2px;
    border-bottom:3px solid var(--border);margin:12px auto 0;width:70%}
  .ansbox.ok{border-color:var(--primary);color:var(--primary)}
  .ansbox.ng{border-color:var(--danger);color:var(--danger)}
  .cursor{display:inline-block;width:2px;height:30px;background:var(--primary);
    animation:bl 1s step-end infinite}
  @keyframes bl{50%{opacity:0}}

  /* キーパッド */
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pad button{background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:16px 0;font-family:'Poppins';font-size:22px;font-weight:700;color:var(--text);
    cursor:pointer;box-shadow:0 2px 0 rgba(30,122,90,.06)}
  .pad button:active{transform:translateY(1px)}
  .pad .wide{grid-column:span 1}
  .pad .fn{font-size:16px;color:var(--sub)}
  .pad .go{background:var(--primary);color:#fff;border-color:var(--primary)}

  .fb{border-radius:14px;padding:12px 14px;margin-top:10px;font-size:13px;font-weight:700;line-height:1.65}
  .fb.ok{background:var(--panel2);color:var(--primary)}
  .fb.ng{background:#FCE9EC;color:var(--danger)}
  .fb .tip{display:block;font-size:11.5px;font-weight:600;color:var(--sub);margin-top:5px}

  /* 結果 */
  .rank{font-family:'Poppins';font-size:52px;font-weight:800;color:var(--primary);text-align:center}
  .rline{display:flex;justify-content:space-between;font-size:13px;font-weight:700;
    padding:9px 0;border-bottom:1px dashed var(--border)}
  .rline:last-child{border:0}
  .rline span:last-child{font-family:'Poppins';color:var(--primary)}

  /* 記録 */
  .stat{display:flex;align-items:center;gap:14px}
  .ring{width:74px;height:74px;flex:0 0 auto}
  .stat .num{font-family:'Poppins';font-size:20px;font-weight:800}
  .rec{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;
    font-weight:700;padding:8px 0;border-bottom:1px dashed var(--border)}
  .rec:last-child{border:0}
  .rec b{font-family:'Poppins';color:var(--accent);font-size:13px}

  .evr{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);
    border-radius:14px;padding:11px 13px;margin-bottom:7px;opacity:.45}
  .evr.got{opacity:1}
  .evr.cur{border-color:var(--accent);background:#FDF4E4;box-shadow:0 0 0 1.5px var(--accent) inset}
  .evr .evn{font-family:'Poppins';font-size:11px;font-weight:800;color:var(--sub);width:20px;flex:0 0 auto;text-align:right}
  .evr .eve{font-size:22px;flex:0 0 auto}
  .evr .evb{flex:1;min-width:0}
  .evr .evt{font-size:13px;font-weight:800;line-height:1.35}
  .evr .evd{font-family:'Poppins';font-size:10px;color:var(--sub);font-weight:700;margin-top:2px}
  .evr.cur .evd{color:#A87415}
  .zkr{display:flex;align-items:flex-start;gap:11px;background:var(--panel);
    border:1px solid var(--border);border-radius:14px;padding:12px 13px;margin-bottom:7px;opacity:.5}
  .zkr.got{opacity:1}
  .zke{font-size:22px;flex:0 0 auto;line-height:1.2}
  .zkb{flex:1;min-width:0}
  .zkn{font-size:13px;font-weight:800;line-height:1.35}
  .zkd{font-size:11px;color:var(--sub);font-weight:500;line-height:1.65;margin-top:4px}
  .zktag{display:inline-block;font-size:9.5px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px}
  .dupn{font-family:Poppins;font-size:10px;font-weight:800;color:var(--accent);margin-left:2px}
  .zktag.N{background:var(--panel2);color:var(--sub)}
  .zktag.R{background:#DCEEF9;color:#1F6FA8}
  .zktag.SR{background:#FBEFD8;color:#A87415}
  .zktag.H{background:#E9ECFF;color:#4A57C4}
  .ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .achb{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:9px 10px;opacity:.45}
  .achb.got{opacity:1;border-color:var(--accent)}
  .achb .an{font-size:11px;font-weight:800;line-height:1.35}
  .achb .ad{font-size:9.5px;color:var(--sub);font-weight:600;margin-top:2px;line-height:1.45}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:#12241D;color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;
    font-weight:700;z-index:99;max-width:88%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  #updBar{display:none;align-items:center;gap:10px;background:var(--accent);color:#3A2400;
    padding:10px 14px;border-radius:12px;margin-bottom:12px;font-size:13px;font-weight:800}
  #updBar button{background:#3A2400;color:var(--accent);border:0;border-radius:8px;
    padding:7px 12px;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit}
  textarea{width:100%;font-family:ui-monospace,Menlo,monospace;font-size:11px;
    background:var(--bg);color:var(--text);border:1px solid var(--border);
    border-radius:10px;padding:10px;resize:vertical}
</style>

<body>
<div class="app">
  <div class="topbar">
    <div>
      <div class="logo">MATH <span>UP!</span></div>
      <div class="sub">計算トレーニング / 小学〜中学</div>
    </div>
    <button class="helpbtn" onclick="renderHelp()" aria-label="使い方">？</button><div class="rankpill" id="rankPill">Lv.1</div>
  </div>
  <div id="updBar"><b style="flex:1">新しいバージョンがあります</b><button onclick="forceUpdate()">更新する</button></div>
  <div id="screen"></div>
</div>

<script>
const STORE_KEY='mathup_v1';
const APP_VER='20260831f';
const $=id=>document.getElementById(id);
const screen_=$('screen');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function todayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}

/* ===== 効果音 =====
   節目のときだけ鳴らす。音声ファイルは持たず、その場で合成している。 */
function soundOn(){ return state.sound!==false; }   // 既定はオン
/* iPhone は画面を触った瞬間でないと音を出す準備ができない。
   最初のタップで無音を1回鳴らして解除し、以後は節目でも鳴らせるようにする。 */
let _acReady=false;
function _audio(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    if(!window._ac)window._ac=new AC();
    const ac=window._ac;
    if(ac.state==='suspended')ac.resume();
    return ac;
  }catch(e){ return null; }
}
function unlockAudio(){
  const ac=_audio();
  if(!ac||_acReady)return;
  try{
    const b=ac.createBuffer(1,1,22050), s=ac.createBufferSource();
    s.buffer=b; s.connect(ac.destination); s.start(0);
    _acReady=true;
  }catch(e){}
}
['touchend','pointerdown','click','keydown'].forEach(function(ev){
  document.addEventListener(ev, unlockAudio, {passive:true});
});
let _chimeAt=0;
function chime(kind){
  if(!soundOn())return;
  const now=Date.now();
  if(now-_chimeAt<450)return;     // レベルアップと図鑑が同時に来たときの二度鳴りを防ぐ
  _chimeAt=now;
  const ac=_audio();
  if(!ac)return;
  try{
    const seq = kind==='level' ? [[523.25,0],[659.25,.10],[783.99,.20],[1046.50,.30]]
              : kind==='card'  ? [[880.00,0],[1174.66,.09]]
              :                  [[659.25,0],[783.99,.10],[1046.50,.20]];
    const dur = kind==='level'?.42:.30;
    seq.forEach(function(p){
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=p[0];
      const t=ac.currentTime+p[1];
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(.16,t+.012);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t+dur+.03);
    });
  }catch(e){}
}
function toggleSound(){
  state.sound = !soundOn();
  save();
  toast(soundOn()?'🔔 音を鳴らします':'🔕 音を止めました');
  if(soundOn())chime('card');
  renderHome();
}

function pop(n){if(navigator.vibrate)try{navigator.vibrate(n||10)}catch(e){}}

/* ===== モード定義 ===== */
const DIFF=[{v:1,n:'やさしい',d:'1けた中心'},{v:2,n:'ふつう',d:'2けた中心'},{v:3,n:'むずかしい',d:'3けた・2けた×2けた'}];
const OPS=[{v:'add',n:'たし算',e:'＋'},{v:'sub',n:'ひき算',e:'−'},{v:'mul',n:'かけ算',e:'×'},{v:'div',n:'わり算',e:'÷'}];
const MODES=[
 {id:'drill', i:'💯', n:'100本ノック', d:'四則を混ぜて100問', mk:mkDrill, count:100, opt:'full'},
 {id:'add',   i:'➕', n:'たし算・ひき算', d:'くり上がり・くり下がりを重点的に', mk:mkAddSub, count:30, opt:'diff'},
 {id:'mul',   i:'✖️', n:'かけ算・わり算', d:'九九から2けたの計算まで', mk:mkMulDiv, count:30, opt:'diff'},
 {id:'kuku',  i:'🔄', n:'九九の逆引き', d:'「56は何×何？」で因数の感覚を養う', mk:mkKuku, count:20},
 {id:'hosu',  i:'🎯', n:'補数', d:'10・100・1000をつくる相棒を探す', mk:mkHosu, count:20},
 {id:'seifu', i:'±',  n:'正負の数', d:'符号のミスをなくす（中1）', mk:mkSeifu, count:30},
 {id:'kufuu', i:'💡', n:'工夫して計算', d:'分けたり寄せたりして速く解く', mk:mkKufuu, count:20},
 {id:'gaisan',i:'📏', n:'概算', d:'およその大きさをつかむ', mk:mkGaisan, count:15},
 {id:'ta',    i:'⏱', n:'タイムアタック', d:'60秒で何問解けるか', mk:mkDrill, count:999, opt:'full', ta:true},
];
function modeOf(id){return MODES.find(m=>m.id===id);}

/* ===== 問題のパターン（どこで転んだかの単位） =====
   記録は細かい粒度で残しておく。あとから粗くまとめることはできても、逆はできないため。 */
const CATN={
 add1n:'1けたのたし算', add1c:'1けたのたし算（くり上がり）',
 add2n:'2けたのたし算', add2c:'2けたのたし算（くり上がり）',
 add3n:'3けたのたし算', add3c:'3けたのたし算（くり上がり）',
 sub1n:'1けたのひき算', sub1b:'1けたのひき算（くり下がり）',
 sub2n:'2けたのひき算', sub2b:'2けたのひき算（くり下がり）',
 sub3n:'3けたのひき算', sub3b:'3けたのひき算（くり下がり）',
 mul1:'九九', mul2:'2けた×1けた', mul3:'2けた×2けた',
 div1:'九九のわり算', div2:'2けたの商', div3:'2けた÷2けた',
 kuku:'九九の逆引き',
 hosu10:'10の補数', hosu100:'100の補数', hosu1000:'1000の補数',
 seifu_add:'正負の数（たし算）', seifu_sub:'正負の数（ひき算）',
 seifu_mul:'正負の数（かけ算）', seifu_div:'正負の数（わり算）',
 kufuu_100:'100に近い数のかけ算', kufuu_25:'25 × □ の工夫',
 kufuu_11:'× 11 の工夫', kufuu_5:'× 5 の工夫',
 gaisan:'およその見当',
};
const CATS=Object.keys(CATN);
function catName(t){return CATN[t]||t;}
// 指定したパターンの問題を新しい数字で作る
function mkCat(cat){
  let gen;
  if(/^add\d/.test(cat))gen=()=>mkAdd(+cat[3]);
  else if(/^sub\d/.test(cat))gen=()=>mkSub(+cat[3]);
  else if(/^mul\d/.test(cat))gen=()=>mkMul(+cat[3]);
  else if(/^div\d/.test(cat))gen=()=>mkDiv(+cat[3]);
  else if(cat==='kuku')gen=mkKuku;
  else if(cat.indexOf('hosu')===0)gen=mkHosu;
  else if(cat.indexOf('seifu')===0)gen=mkSeifu;
  else if(cat.indexOf('kufuu')===0)gen=mkKufuu;
  else gen=mkGaisan;
  for(let i=0;i<40;i++){const q=gen();if(q.t===cat)return q;}
  return gen();
}

/* ===== 問題生成 ===== */
// くり上がり・くり下がりがあるか。どこで転んだかを見分けるための目印
function hasCarry(a,b){let c=0;while(a>0||b>0){if((a%10)+(b%10)+c>=10)return true;c=0;a=Math.floor(a/10);b=Math.floor(b/10);}return false;}
function hasBorrow(a,b){let br=0;while(b>0||br){if((a%10)-br<(b%10))return true;a=Math.floor(a/10);b=Math.floor(b/10);br=0;}return false;}
function mkAdd(d){
  d=d||2; let a,b;
  if(d===1){a=rnd(2,9);b=rnd(2,9);}
  else if(d===2){a=rnd(11,99);b=rnd(11,99);}
  else{a=rnd(101,999);b=rnd(101,999);}
  return{q:`${a} + ${b}`,a:a+b,t:'add'+d+(hasCarry(a,b)?'c':'n')};
}
function mkSub(d){
  d=d||2; let a,b;
  if(d===1){a=rnd(5,18);b=rnd(2,a-1);}
  else if(d===2){a=rnd(21,199);b=rnd(11,a-1);}
  else{a=rnd(301,999);b=rnd(101,a-1);}
  return{q:`${a} - ${b}`,a:a-b,t:'sub'+d+(hasBorrow(a,b)?'b':'n')};
}
function mkMul(d){
  d=d||2; let a,b;
  if(d===1){a=rnd(2,9);b=rnd(2,9);}
  else if(d===2){a=rnd(11,29);b=rnd(3,9);}
  else{a=rnd(12,49);b=rnd(11,29);}
  return{q:`${a} × ${b}`,a:a*b,t:'mul'+d};
}
function mkDiv(d){
  d=d||2; let b,ans;
  if(d===1){b=rnd(2,9);ans=rnd(2,9);}
  else if(d===2){b=rnd(3,9);ans=rnd(11,29);}
  else{b=rnd(11,29);ans=rnd(3,19);}
  return{q:`${b*ans} ÷ ${b}`,a:ans,t:'div'+d};
}
function mkAddSub(d){ return rnd(0,1)?mkAdd(d||2):mkSub(d||2); }
function mkMulDiv(d){ return rnd(0,1)?mkMul(d||2):mkDiv(d||2); }
function mkDrill(d,ops){
  const use=(ops&&ops.length)?ops:['add','sub','mul','div'];
  const t=pick(use), dd=d||2;
  return t==='add'?mkAdd(dd):t==='sub'?mkSub(dd):t==='mul'?mkMul(dd):mkDiv(dd);
}
function mkKuku(){
  const a=rnd(2,9),b=rnd(2,9);
  return{q:`${a*b} = ${a} × ?`,a:b,hint:'九九を逆からたどる',t:'kuku'};
}
function mkHosu(){
  const base=pick([10,100,1000]);
  const a=base===10?rnd(1,9):base===100?rnd(11,99):rnd(101,999);
  return{q:`${a} + ? = ${base}`,a:base-a,hint:'あといくつで '+base+' になる？',t:'hosu'+base};
}
function mkSeifu(){
  const t=rnd(1,4);
  const s=()=>rnd(0,1)?1:-1;
  const f=n=>n<0?`(${n})`:`${n}`;
  if(t===1){const a=s()*rnd(2,20),b=s()*rnd(2,20);return{q:`${a} + ${f(b)}`,a:a+b,t:'seifu_add'};}
  if(t===2){const a=s()*rnd(2,20),b=s()*rnd(2,20);return{q:`${a} - ${f(b)}`,a:a-b,t:'seifu_sub'};}
  if(t===3){const a=s()*rnd(2,9),b=s()*rnd(2,9);return{q:`${a} × ${f(b)}`,a:a*b,t:'seifu_mul'};}
  const b=s()*rnd(2,9),ans=s()*rnd(2,9);return{q:`${b*ans} ÷ ${f(b)}`,a:ans,t:'seifu_div'};
}
function mkKufuu(){
  const t=rnd(1,4);
  if(t===1){const a=pick([98,99,102,103]),b=rnd(3,9);
    return{q:`${a} × ${b}`,a:a*b,hint:`${a>100?'100+':'100−'}${Math.abs(a-100)} と考える`,t:'kufuu_100'};}
  if(t===2){const b=pick([4,8,12,16,20,24]);
    return{q:`25 × ${b}`,a:25*b,hint:'25×4=100 を使う',t:'kufuu_25'};}
  if(t===3){const a=rnd(11,49);
    return{q:`${a} × 11`,a:a*11,hint:'×10 と ×1 に分ける',t:'kufuu_11'};}
  const a=rnd(12,60);
  return{q:`${a} × 5`,a:a*5,hint:'×10 してから半分にする',t:'kufuu_5'};
}
function mkGaisan(){
  const a=pick([198,297,396,485,502,613,798]),b=rnd(11,29);
  const exact=a*b;
  const base=Math.pow(10,String(exact).length-1);
  const near=Math.round(exact/base)*base;
  const set=new Set([near, near+base, Math.max(base,near-base), near*10]);
  const opts=[...set].slice(0,4);
  while(opts.length<4)opts.push(opts[opts.length-1]+base);
  return{q:`${a} × ${b} はおよそ？`,a:near,
    choices:opts.sort(()=>Math.random()-.5),hint:'けた数で見当をつける',t:'gaisan'};
}

function load(){
  try{const r=localStorage.getItem(STORE_KEY);if(r)return JSON.parse(r);}catch(e){}
  return {xp:0,ach:[],best:{},total:0,correct:0,streak:{day:'',count:0},
          stat:{day:'',dayQ:0,modes:[]},wrong:{},cards:[],cardMile:0};
}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}}
let state=load();
if(!state.best)state.best={};
if(!state.stat)state.stat={day:'',dayQ:0,modes:[]};
if(!state.wrong)state.wrong={};
if(!state.cards)state.cards=[];
if(!state.cardCount){
  state.cardCount={};
  (state.cards||[]).forEach(id=>{state.cardCount[id]=(state.cardCount[id]||0)+1;});
}
if(state.cardMile==null)state.cardMile=0;
// 記録の一部が欠けた状態で読み込まれてもホームが真っ白にならないようにする
if(state.xp==null)state.xp=0;
if(!state.ach)state.ach=[];
if(!state.streak)state.streak={day:'',count:0};
if(state.total==null)state.total=0;
if(state.correct==null)state.correct=0;
if(!state.cfg)state.cfg={};
if(!state.mstat)state.mstat={};
function dayNum(t){const d=t||new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5);}
// これまで state.wrong に溜まっていた「まちがえた問題」を、一度だけパターン別の記録に移す
function migrateWrong(){
  if(state.mstatMig)return;
  state.mstatMig=1;
  Object.keys(state.wrong||{}).forEach(q=>{
    const t=catOfText(q);
    if(!t)return;
    const ms=state.mstat[t]||{c:0,w:0};
    ms.w++; state.mstat[t]=ms;
  });
  save();
}
function catOfText(q){
  if(/およそ/.test(q))return 'gaisan';
  let m=q.match(/^(\d+) \+ \? = (\d+)$/); if(m)return 'hosu'+m[2];
  m=q.match(/^(\d+) = (\d+) × \?$/); if(m)return 'kuku';
  if(/\(/.test(q)||/^-/.test(q)){
    if(/ \+ /.test(q))return 'seifu_add';
    if(/ - /.test(q))return 'seifu_sub';
    if(/ × /.test(q))return 'seifu_mul';
    if(/ ÷ /.test(q))return 'seifu_div';
    return null;
  }
  m=q.match(/^(\d+) ([+\-×÷]) (\d+)$/);
  if(!m)return null;
  const a=+m[1],b=+m[3],dg=Math.min(3,Math.max(String(a).length,String(b).length));
  if(m[2]==='+')return 'add'+dg+(hasCarry(a,b)?'c':'n');
  if(m[2]==='-')return 'sub'+dg+(hasBorrow(a,b)?'b':'n');
  if(m[2]==='×')return 'mul'+(a<10&&b<10?1:(b<10?2:3));
  return 'div'+(a<100?1:(a<1000?2:3));
}
migrateWrong();

const MAXLV=20;
function xpNeed(l){return 40*l+2*l*l;}
function lvlInfo(xp){
  let l=1,acc=0,need=xpNeed(1);
  while(l<MAXLV&&xp>=acc+need){acc+=need;l++;need=xpNeed(l);}
  if(l>=MAXLV)return{level:MAXLV,cur:Math.max(0,xp-acc),need:xpNeed(MAXLV),max:true};
  return{level:l,cur:xp-acc,need};
}

function cardsNormal(){return CARDS.filter(c=>c.r!=='H');}
function grantCard(){
  chime('card');
  const cnt=state.cardCount||(state.cardCount={});
  const owned=id=>(cnt[id]||0)>0;
  // 未所持は重み3倍。重複も出るが新規が出やすい
  const W={N:6,R:3,SR:1,H:0};
  const build=arr=>{
    let tot=0; const w=arr.map(c=>{const v=(W[c.r]||1)*(owned(c.id)?1:3); tot+=v; return v;});
    return {arr,w,tot};
  };
  const draw=pool=>{
    const {arr,w,tot}=build(pool);
    let x=Math.random()*tot;
    for(let i=0;i<arr.length;i++){x-=w[i];if(x<=0)return arr[i];}
    return arr[arr.length-1];
  };
  const give=(c,isHidden)=>{
    cnt[c.id]=(cnt[c.id]||0)+1;
    if(!state.cards.includes(c.id))state.cards.push(c.id);
    save();
    const dup=cnt[c.id]>1;
    const msg=isHidden
      ? '🔮 隠し図鑑を発見！ '+c.e+' '+c.n+(dup?'（重複 ×'+cnt[c.id]+'）':'')
      : '📖 図鑑に追加: '+c.e+' '+c.n+(dup?'（重複 ×'+cnt[c.id]+'）':(c.r==='SR'?'（超レア！）':c.r==='R'?'（レア）':''));
    setTimeout(()=>{toast(msg);pop(dup?6:20);},1400);
  };
  const hid=CARDS.filter(c=>c.r==='H');
  const newHid=hid.filter(c=>!owned(c.id));
  if(hid.length&&Math.random()<0.04){
    give(newHid.length?newHid[Math.floor(Math.random()*newHid.length)]
                      :hid[Math.floor(Math.random()*hid.length)],true);
    return;
  }
  const pool=CARDS.filter(c=>c.r!=='H');
  if(!pool.length)return;
  give(draw(pool),false);
}

  while(state.cardMile<due){state.cardMile++;grantCard();}

}

/* ===================== 今日の20問 =====================

   数字を変えた新しい問題を出す。                                    */
const DAILY_N=20, DAILY_CAT_MAX=5;
function catScore(cat,today){
  const s=state.mstat[cat];
  if(!s||(s.c+s.w)===0)return 55;                  // まだやったことがない
  const err=s.w/(s.c+s.w);                         // 誤答率
  const el=Math.max(0,s.d?today-s.d:60);           // 何日ぶりか（端末の時計がずれても負にしない）
  return Math.max(5, 20+err*120+Math.min(el,30)*1.5);
}
function buildDaily(){
  const today=dayNum();
  const w=CATS.map(c=>Math.pow(catScore(c,today),2));   // 差をはっきりさせる
  const used={},list=[];
  for(let i=0;i<DAILY_N;i++){
    let tot=0;
    const ww=CATS.map((c,k)=>{const v=(used[c]||0)>=DAILY_CAT_MAX?0:w[k];tot+=v;return v;});
    if(tot<=0)break;
    let r=Math.random()*tot,cat=CATS[0];
    for(let k=0;k<CATS.length;k++){r-=ww[k];if(r<=0){cat=CATS[k];break;}}
    used[cat]=(used[cat]||0)+1;
    list.push(mkCat(cat));
  }
  return list;
}
function daily(){
  const t=todayStr();
  if(!state.daily||state.daily.d!==t){
    const l=buildDaily();
    if(!l.length)return null;
    state.daily={d:t,list:l,i:0,ok:0,fin:false};
    save();
  }
  return state.daily;
}
function dailyCard(){
  const d=daily(); if(!d)return '';
  const tot=d.list.length,done=d.i,fin=d.fin||done>=tot;
  let sub,go;
  if(fin){ sub='おわり！ '+d.ok+'/'+tot+' 正解'; go='もう一度'; }
  else if(done>0){ sub='あと '+(tot-done)+' 問'; go='つづき'; }
  else { sub='苦手なパターンを多めに出すよ'; go='はじめる'; }
  return `<div class="daily${fin?' done':''}" onclick="startDaily()">
      <div class="dic">${fin?'🎉':'☀️'}</div>
      <div class="dbd"><h3>今日の${DAILY_N}問</h3><p>${sub}</p>${
        (done>0&&!fin)?`<div class="dbar"><i style="width:${Math.round(done/tot*100)}%"></i></div>`:''}</div>
      <div class="dgo">${go} ›</div>
    </div>`;
}
function startDaily(){
  const d=daily();
  if(!d){toast('問題を作れませんでした');return;}
  const rest=d.list.slice(d.i);
  const replay=!rest.length;
  const list=replay?d.list.slice():rest;   // やり終わっていたら同じ20問でもう一周（記録は据え置き）
  if(!list.length)return;
  touchStreak();
  g={m:{id:'daily',i:'☀️',n:'今日の'+DAILY_N+'問',count:list.length,mk:null},
     i:0,score:0,combo:0,maxCombo:0,miss:[],buf:'',answered:false,t0:Date.now(),
     cur:null,list:list,done:false,ta:false,timer:null,daily:true,replay:replay};
  g.m.mk=()=>g.list[g.i];
  next();
}
function retryDailyMiss(){
  const list=g.miss.slice();
  if(!list.length){renderHome();return;}
  g={m:{id:'daily',i:'🔁',n:'まちがえた問題',count:list.length,mk:null},
     i:0,score:0,combo:0,maxCombo:0,miss:[],buf:'',answered:false,t0:Date.now(),
     cur:null,list:list,done:false,ta:false,timer:null,daily:true,replay:true};
  g.m.mk=()=>g.list[g.i];
  next();
}
function finishDaily(){
  const d=state.daily,total=g.list.length,rate=Math.round(g.score/total*100);
  const rank=rate>=95?'S':rate>=85?'A':rate>=70?'B':rate>=50?'C':'D';
  const sec=Math.round((Date.now()-g.t0)/1000);
  const alldone=!!d&&d.i>=d.list.length;
  if(alldone&&d&&!d.fin){d.fin=true;state.dailyDone=(state.dailyDone||0)+1;chime('daily');}
  unlock('first');
  addXp(rate>=95?30:rate>=85?20:10);
  save();checkAch();
  // パターンごとの内訳。どこで転んだかが一目でわかる
  const per={};
  g.list.forEach(q=>{if(!q.t)return;per[q.t]=per[q.t]||{n:0,ng:0};per[q.t].n++;});
  g.miss.forEach(q=>{if(q.t&&per[q.t])per[q.t].ng++;});
  const all=Object.keys(per).map(t=>({t:t,n:per[t].n,ok:per[t].n-per[t].ng}))
    .sort((a,b)=>(a.ok/a.n)-(b.ok/b.n));
  const bad=all.filter(r=>r.ok<r.n);

function openMode(mid){

  cfg={diff:saved.diff||2, ops:saved.ops||['add','sub','mul','div'], count:saved.count||defCount};
  g0=m; renderSetup(m);
}

    <button class="btn btn-primary" style="margin-top:16px" onclick="start('${m.id}')">はじめる ›</button>`;
}
function setDiff(v){cfg.diff=v;renderSetup(g0);}
function toggleOp(v){
  const i=cfg.ops.indexOf(v);
  if(i>=0){ if(cfg.ops.length<=1){toast('1つ以上えらんでください');return;} cfg.ops.splice(i,1); }
  else cfg.ops.push(v);
  renderSetup(g0);
}
function setCount(c){cfg.count=c;renderSetup(g0);}
let g0=null;
function start(mid){
  const m=modeOf(mid);
  if(!state.stat.modes)state.stat.modes=[];
  if(!state.stat.modes.includes(mid))state.stat.modes.push(mid);
  touchStreak();
  const cnt=(m.opt?cfg.count:m.count);
  if(m.opt){
    if(!state.cfg)state.cfg={};
    state.cfg[mid]={diff:cfg.diff,ops:cfg.ops.slice(),count:cfg.count};save();
  }
  g={m:Object.assign({},m,{count:m.ta?999:cnt}),i:0,score:0,combo:0,maxCombo:0,miss:[],
     buf:'',answered:false,t0:Date.now(),cur:null,diff:cfg.diff,ops:cfg.ops.slice(),
     ta:!!m.ta, t:m.ta?cnt:0, limit:m.ta?cnt:0, timer:null, done:false};
  next();
  if(g.ta)startTimer();
}
function startTimer(){
  clearInterval(g.timer);
  const tm=setInterval(()=>{
    if(!g||!g.ta||g.done){clearInterval(tm);return;}
    g.t--;
    const el=$('tm');
    if(el){el.textContent=g.t+'秒';if(g.t<=10)el.style.color='var(--danger)';}
    if(g.t<=0){clearInterval(tm);finish();}
  },1000);
  g.timer=tm;
}
function next(){
  if(!g||g.done)return;
  if(g.i>=g.m.count)return finish();
  g.cur=g.m.mk(g.diff,g.ops);g.buf='';g.answered=false;
  render();
}
function key(k){
  if(!g||g.done||g.answered)return;
  if(k==='del'){g.buf=g.buf.slice(0,-1);}
  else if(k==='-'){g.buf=g.buf.startsWith('-')?g.buf.slice(1):'-'+g.buf;}
  else if(k==='go'){return submit();}
  else{ if(g.buf.replace('-','').length<6)g.buf+=k; }
  render();
}
function submit(){
  if(!g||g.done)return;
  if(g.answered||g.buf===''||g.buf==='-')return;
  g.answered=true;
  const v=parseInt(g.buf,10),ok=v===g.cur.a;
  bumpQ();state.total++;
  if(ok){
    g.score++;g.combo++;g.maxCombo=Math.max(g.maxCombo,g.combo);
    state.correct++;addXp(3+Math.min(7,Math.floor(g.combo/5)));
    if(g.combo>=10)unlock('combo10');
    if(g.combo>=30)unlock('combo30');
    if(g.combo>=50)unlock('combo50');
    delete state.wrong[g.cur.q];
    setTimeout(checkCardMilestone,60);
    pop(8);
  }else{
    g.combo=0;g.miss.push(g.cur);
    state.wrong[g.cur.q]=g.cur.a;
    pop(30);
  }
  if(g.cur.t){                                   // どのパターンで転んだかを残す
    const ms=state.mstat[g.cur.t]||{c:0,w:0};
    if(ok)ms.c++; else ms.w++;
    ms.d=dayNum(); state.mstat[g.cur.t]=ms;
  }
  if(g.daily&&!g.replay&&state.daily){state.daily.i++;if(ok)state.daily.ok++;}
  save();checkAch();render();
  setTimeout(()=>{ if(!g||g.done)return; g.i++;next(); },ok?450:1600);
}
function render(){
  const m=g.m,q=g.cur;
  const pct=Math.round(g.i/m.count*100);
  const big=q.q.length>14?'qtext sm':'qtext';
  const shown=g.answered?(g.buf||'—'):(g.buf||'');
  const cls=g.answered?(parseInt(g.buf,10)===q.a?'ansbox ok':'ansbox ng'):'ansbox';
  screen_.innerHTML=`
    <button class="back" onclick="quit()">‹ やめる</button>
    <div class="qhead"><h2>${m.i} ${m.n}</h2>
      <span class="qmeta">${g.ta?`<span id="tm">${g.t}秒</span>　${g.score}問`:`${g.i+1} / ${m.count}`}　${g.combo>=3?'🔥'+g.combo:''}</span></div>
    <div class="bar"><i style="width:${g.ta?Math.max(0,g.t/g.limit*100):pct}%"></i></div>
    <div class="qbox">
      <div class="${big}">${q.q}</div>
      ${q.hint&&!g.answered?`<div class="qhint">💡 ${q.hint}</div>`:''}
      <div class="${cls}">${shown}${g.answered?'':'<span class="cursor"></span>'}</div>
    </div>
    ${g.answered?fb():(q.choices?choicePad(q):pad())}`;
}
function choicePad(q){
  return `<div style="display:grid;gap:8px">${q.choices.map(c=>
    `<button class="btn btn-ghost" style="font-family:Poppins;font-size:18px" onclick="answerChoice(${c})">${c.toLocaleString()}</button>`).join('')}</div>`;
}
function answerChoice(v){
  if(!g||g.done||g.answered)return;
  g.buf=String(v);
  submit();
}
function pad(){
  const k=(v,l,c)=>`<button class="${c||''}" onclick="key('${v}')">${l}</button>`;
  return `<div class="pad">
    ${k('7','7')}${k('8','8')}${k('9','9')}
    ${k('4','4')}${k('5','5')}${k('6','6')}
    ${k('1','1')}${k('2','2')}${k('3','3')}
    ${k('-','±','fn')}${k('0','0')}${k('del','⌫','fn')}
    </div>
    <button class="btn btn-primary" style="margin-top:8px" onclick="key('go')">こたえる</button>`;
}
function fb(){
  const q=g.cur,ok=parseInt(g.buf,10)===q.a;
  return `<div class="fb ${ok?'ok':'ng'}">${ok?'⭕ 正解':'❌ 正解は '+q.a.toLocaleString()}
    ${!ok&&q.hint?`<span class="tip">💡 ${q.hint}</span>`:''}</div>`;
}
function quit(){ if(g){clearInterval(g.timer); if(g.i>0)save();} g=null; renderHome(); }
function finish(){
  if(!g||g.done)return;
  g.done=true;
  if(g.timer)clearInterval(g.timer);
  if(g.daily)return finishDaily();
  const m=g.m;
  const total=g.ta?Math.max(1,g.i):m.count;
  const rate=Math.round(g.score/total*100);
  const sec=g.ta?g.limit:Math.round((Date.now()-g.t0)/1000);
  const rank=g.ta
    ?(g.score>=40?'S':g.score>=30?'A':g.score>=20?'B':g.score>=10?'C':'D')
    :(rate>=95?'S':rate>=85?'A':rate>=70?'B':rate>=50?'C':'D');
  const key=g.ta?`ta_d${g.diff}_${g.limit}`:(m.opt?`${m.id}_d${g.diff}_${total}`:m.id);
  const prev=state.best[key]||{score:0,sec:99999};
  if(g.ta){
    if(g.score>prev.score)state.best[key]={score:g.score,sec:g.limit};
  }else if(g.score>prev.score||(g.score===prev.score&&sec<prev.sec)){
    state.best[key]={score:g.score,sec};
  }
  if(!state.best[key])state.best[key]={score:prev.score,sec:prev.sec===99999?sec:prev.sec};
  if(g.ta){
    if(g.score>=20)unlock('ta20');
    if(g.score>=30)unlock('ta30');
    if(g.score>=40)unlock('ta40');
  }
  unlock('first');
  if(m.id==='drill'){
    unlock('drill1');
    if(g.score>=90)unlock('drill90');
    if(g.score===total){unlock('drill100');}
    if(g.score===total&&sec<=300)unlock('speed');
  }
  if(g.score===total&&['kuku','hosu','seifu','kufuu'].includes(m.id))unlock(m.id);
  addXp(rate>=95?30:rate>=85?20:10);
  save();checkAch();
  const mm=Math.floor(sec/60),ss=String(sec%60).padStart(2,'0');
  screen_.innerHTML=`
    <button class="back" onclick="renderHome()">‹ もどる</button>
    <div class="card">
      <div class="rank">${rank}</div>
      <div style="text-align:center;font-size:14px;font-weight:800;margin-bottom:14px">
        ${g.ta?`${g.limit}秒で ${g.score} 問正解`:`${g.score} / ${total} 問正解`}</div>
      ${g.ta?`
      <div class="rline"><span>挑戦した問題</span><span>${g.i}問</span></div>
      <div class="rline"><span>正答率</span><span>${rate}%</span></div>
      <div class="rline"><span>1問あたり</span><span>${(g.limit/Math.max(1,g.score)).toFixed(1)}秒</span></div>`:`
      <div class="rline"><span>正答率</span><span>${rate}%</span></div>
      <div class="rline"><span>かかった時間</span><span>${mm}分${ss}秒</span></div>
      <div class="rline"><span>1問あたり</span><span>${(sec/total).toFixed(1)}秒</span></div>`}
      <div class="rline"><span>最大れんぞく正解</span><span>${g.maxCombo}</span></div>
      <div class="rline"><span>自己ベスト</span><span>${state.best[key].score}問</span></div>
    </div>
    ${g.miss.length?`<div class="label">まちがえた問題（${g.miss.length}）</div>
      <div class="card">${g.miss.slice(0,12).map(x=>
        `<div class="rec"><span>${x.q}</span><b>${x.a}</b></div>`).join('')}
      ${g.miss.length>12?`<p class="help" style="margin-top:8px">ほか ${g.miss.length-12} 問</p>`:''}</div>`:''}

      <button class="btn btn-ghost" onclick="renderHome()">ホームへ</button>
    </div>`;
}

      MODES.forEach(m=>{
        Object.keys(state.best||{}).forEach(k=>{
          if(k===m.id||k.startsWith(m.id+'_')){
            const b=state.best[k];
            const md=k.match(/_d(\d)_(\d+)/);
            const dn=md?(DIFF.find(x=>x.v===+md[1])||{}).n:'';
            const unit=m.ta?`${md?md[2]:''}秒で`:'';
            rows.push(`<div class="rec"><span>${m.i} ${m.n}${dn?'（'+dn+'）':''}</span>
              <b>${unit}${b.score}${m.ta?'問':'/'+(md?md[2]:m.count)}</b></div>`);
          }});
      });
      return rows.length?`<div class="label">🏆 ベストスコア</div><div class="card">${rows.join('')}</div>`:'';})()}
    <div class="label">🏅 実績（${ACH.filter(a=>state.ach.includes(a.id)).length}/${ACH.length}）</div>
    <div class="ach-grid">
      ${ACH.map(a=>{const got=state.ach.includes(a.id);
        return `<div class="achb ${got?'got':''}"><div class="an">${got?'🏅':'🔒'} ${a.name}</div>
        <div class="ad">${a.desc}</div></div>`;}).join('')}
    </div>
    ${(()=>{const f=ACH_SECRET.filter(a=>state.ach.includes(a.id));
      return f.length?`<div class="label">🕵️ 隠し実績（${f.length}）</div><div class="ach-grid">${
        f.map(a=>`<div class="achb got" style="border-color:#5A68D8"><div class="an">🕵️ ${a.name}</div>
        <div class="ad">${a.desc}</div></div>`).join('')}</div>`:'';})()}

    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn btn-ghost" style="flex:1;font-size:12px;padding:11px" onclick="toggleSound()">${soundOn()?'🔔 音あり':'🔕 音なし'}</button><button class="btn btn-ghost" style="flex:1;font-size:12px;padding:11px" onclick="checkUpdate(false)">🔄 更新を確認</button>
      <button class="btn btn-ghost" style="flex:1;font-size:12px;padding:11px" onclick="renderBackup()">💾 記録の保存</button>
    </div>
    <p class="help" style="text-align:center;margin-top:8px;opacity:.6">バージョン ${APP_VER}</p>`;
}
function startWrong(){
  const ks=Object.keys(state.wrong);
  if(!ks.length){toast('まちがえた問題はありません');return;}
  const list=ks.slice(0,30).map(q=>({q,a:state.wrong[q]}));
  g={m:{id:'wrong',i:'⚠️',n:'まちがえた問題',count:list.length,mk:null},
     i:0,score:0,combo:0,maxCombo:0,miss:[],buf:'',answered:false,t0:Date.now(),
     cur:null,list,done:false,ta:false,timer:null};
  g.m.mk=()=>g.list[g.i];
  next();
}

/* ===== 更新・バックアップ ===== */
function forceUpdate(){ location.replace(location.origin+location.pathname+'?v='+Date.now()); }
async function checkUpdate(silent){
  try{
    const r=await fetch(location.origin+location.pathname+'?c='+Date.now(),{cache:'no-store'});
    const t=await r.text();
    const m=t.match(/const APP_VER='([^']+)'/);
    if(m&&m[1]!==APP_VER){
      const bar=$('updBar');
      if(bar){bar.style.display='flex';bar.querySelector('b').textContent='新しいバージョン '+m[1]+' があります';}
      return true;
    }
    if(!silent)toast('最新版です（'+APP_VER+'）');
    return false;
  }catch(e){ if(!silent)toast('確認できませんでした'); return false; }
}
function exportProgress(){
  return JSON.stringify({app:'mathup',v:1,ver:APP_VER,d:{
    xp:state.xp,ach:state.ach,best:state.best,total:state.total,
    correct:state.correct,streak:state.streak,stat:state.stat,wrong:state.wrong,
    cards:state.cards,cardCount:state.cardCount,cardMile:state.cardMile,cfg:state.cfg,
    mstat:state.mstat,mstatMig:state.mstatMig,dailyDone:state.dailyDone}});
}
function copyProgress(){
  const t=exportProgress();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>{markBackedUp();toast('コピーしました ✓');}).catch(selCopy);
  }else selCopy();
}
function selCopy(){
  const el=$('bkText'); if(!el)return;
  el.removeAttribute('readonly');el.select();el.setSelectionRange(0,999999);
  try{document.execCommand('copy');toast('コピーしました ✓');}
  catch(e){toast('長押しして手動でコピーしてください');}
  el.setAttribute('readonly','');
}
/* ===== 記録をファイルでやりとりする ===== */
/* ===== 記録の保存をうながす =====
   端末の中だけに記録があるので、ブラウザのデータを消すと消えてしまう。
   しばらく保存していない人にだけ、静かに知らせる。押しつけない。 */
const BK_EVERY=30, BK_SNOOZE=7, BK_MIN_XP=500;
function bkDue(){
  if((state.xp|0)<BK_MIN_XP)return false;          // 失うものが小さいうちは出さない
  const t=dayNum();
  if(state.bkAt==null){ state.bkAt=t; save(); return false; }   // 初回はここから数えはじめる
  if(state.bkSnooze && t<state.bkSnooze)return false;
  return t-state.bkAt>=BK_EVERY;
}
function backupNote(){
  if(!bkDue())return '';
  const d=dayNum()-state.bkAt;
  return `<div class="bknote">
      <p><b>記録を保存しておきませんか</b><br>
      ${d}日ぶんの記録が、この端末の中だけにあります。ブラウザのデータを消すと、いっしょに消えてしまいます。</p>
      <div class="row2">
        <button class="btn btn-primary" style="font-size:12px;padding:9px" onclick="goBackup()">💾 保存する</button>
        <button class="btn btn-ghost" style="font-size:12px;padding:9px" onclick="bkLater()">あとで</button>
      </div>
    </div>`;
}
function goBackup(){ renderBackup(); }
function bkLater(){ state.bkSnooze=dayNum()+BK_SNOOZE; save(); toast('また'+BK_SNOOZE+'日後にお知らせします'); renderHome(); }
function markBackedUp(){ state.bkAt=dayNum(); state.bkSnooze=0; save(); }

function backupFileName(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return 'math-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.json';
}
async function saveToFile(){
  const text=exportProgress(), name=backupFileName();
  try{
    if(window.File&&navigator.canShare){
      const f=new File([text],name,{type:'application/json'});
      if(navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:name}); markBackedUp(); return; }
    }
  }catch(e){ if(e&&e.name==='AbortError')return; }
  try{
    const b=new Blob([text],{type:'application/json;charset=utf-8'});
    const u=URL.createObjectURL(b), a=document.createElement('a');
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); },1000);
    markBackedUp();toast('ファイルに保存しました ✓');
  }catch(e){ toast('保存できませんでした。コピーをお使いください'); }
}
function loadFromFile(){
  const i=document.createElement('input');
  i.type='file'; i.accept='application/json,.json,.txt';
  i.onchange=function(){
    const f=i.files&&i.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=function(){
      const el=document.getElementById('impText');
      if(!el){ toast('読み込む画面をひらいてから選んでください'); return; }
      el.value=String(r.result||'');
      importProgress();
    };
    r.onerror=function(){ toast('ファイルを読めませんでした'); };
    r.readAsText(f);
  };
  i.click();
}

function importProgress(){
  const raw=($('impText')||{}).value||'';
  if(!raw.trim()){toast('貼り付けてから読み込んでください');return;}
  let o;try{o=JSON.parse(raw.trim());}catch(e){toast('形式が正しくありません');return;}
  const d=o&&o.d?o.d:null;
  if(!d){toast('記録が見つかりません');return;}
  if(o.app&&o.app!=='mathup'){toast('MATH UP! の記録ではありません');return;}
  if(!confirm('いまの記録を置きかえます。よろしいですか？'))return;
  state.xp=d.xp||0;state.ach=d.ach||[];state.best=d.best||{};
  state.total=d.total||0;state.correct=d.correct||0;
  state.streak=d.streak||{day:'',count:0};
  if(d.stat)state.stat=d.stat;
  state.wrong=d.wrong||{};
  state.cards=d.cards||[];state.cardCount=d.cardCount||{};state.cardMile=d.cardMile||0;
  state.cfg=d.cfg||{};
  state.mstat=d.mstat||{};state.mstatMig=d.mstatMig||0;state.dailyDone=d.dailyDone||0;
  state.daily=null;
  save();toast('記録を復元しました ✓');renderHome();
}
function renderBackup(){
  screen_.innerHTML=`
    <button class="back" onclick="renderHome()">‹ もどる</button>
    <div class="qhead"><h2>💾 記録の保存</h2></div>
    <p class="help" style="margin-bottom:12px">記録はこの端末の中だけに保存されています。機種変更のときや、ホーム画面のアイコンを入れ直すときは、ここで書き出して持ち出せます。</p>
    <div class="card">
      <div style="font-size:12px;color:var(--sub);font-weight:700;margin-bottom:8px">
        いまの記録（Lv.${lvlInfo(state.xp).level} / ${state.correct.toLocaleString()}問正解）</div>
      <textarea id="bkText" readonly style="min-height:110px">${exportProgress()}</textarea>
      <div class="row2" style="margin-top:10px"><button class="btn btn-primary" style="font-size:12.5px" onclick="saveToFile()">💾 ファイルに保存</button><button class="btn btn-ghost" style="font-size:12.5px" onclick="copyProgress()">📋 コピー</button></div>
    </div>
    <p class="help" style="margin:14px 0 8px">▼ 別の端末やアイコンで復元するときは、保存したファイルを選ぶか、コピーした内容を貼り付けます。</p>
    <div class="card">
      <textarea id="impText" placeholder="ここに貼り付け" style="min-height:90px"></textarea>
      <div class="row2" style="margin-top:10px"><button class="btn btn-primary" style="font-size:12.5px" onclick="loadFromFile()">📂 ファイルを選ぶ</button><button class="btn btn-ghost" style="font-size:12.5px" onclick="importProgress()">📋 貼り付け</button></div>
    </div>`;
}

renderHome();
setTimeout(()=>checkUpdate(true),1800);
</script>
</body>
</html>
